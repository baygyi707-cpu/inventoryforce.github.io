<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockPilot Inventory V2</title><style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#17202a;--muted:#687584;--line:#e1e6ec;--accent:#2463eb;--good:#138a55;--warn:#d98500;--bad:#d64545}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#edf1f5;color:#243140}.danger{background:var(--bad);color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;padding:32px;border-radius:18px;box-shadow:0 15px 50px #17202a22}.loginbox h1{margin-top:0}.loginbox input{width:100%;margin:7px 0 14px}.app{display:none}.top{height:66px;background:#162231;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.brand{font-size:20px;font-weight:800}.top small{color:#cbd5e1}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}aside button{width:100%;text-align:left;background:transparent;margin:3px 0;color:#44515f}aside button.active,aside button:hover{background:#eaf0ff;color:var(--accent)}main{padding:24px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title h2{margin:0 0 4px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.card .label{color:var(--muted);font-size:13px}.card .num{font-size:26px;font-weight:800;margin-top:6px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:700}.wide{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}th{background:#f8fafc}.tablewrap{overflow:auto}.pill{padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800;display:inline-block}.good{background:#dff5e9;color:#117347}.warning{background:#fff0d2;color:#a55d00}.bad{background:#ffe1e1;color:#a72d2d}.thumb{width:48px;height:48px;object-fit:cover;border-radius:7px;background:#eee;border:1px solid var(--line)}.notice{padding:12px;border-radius:10px;background:#fff0d2;color:#825000;margin:12px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.scanner{display:none}.scanner video{width:100%;max-width:500px;border-radius:12px;background:#111}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}aside button{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.wide{grid-column:span 1}}@media(max-width:500px){main{padding:14px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{padding:0 14px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>📦 StockPilot</h1><p class="muted">Professional Inventory V2</p><label>Username</label><input id="loginUser" value="admin"><label>Password</label><input id="loginPass" type="password"><button class="primary" style="width:100%" onclick="login()">Sign In</button><p class="muted" style="font-size:12px">Demo login: <b>admin</b> / <b>admin123</b>. Change it in Settings.</p><div id="loginErr" style="color:#c33"></div></div></div>
<div id="app" class="app"><header class="top"><div class="brand">📦 StockPilot</div><div><small id="userLabel">admin</small> &nbsp; <button class="ghost" onclick="logout()">Log out</button></div></header><div class="layout"><aside><button class="active" onclick="showView('dashboard',this)">📊 Dashboard</button><button onclick="showView('items',this)">📦 Inventory</button><button onclick="showView('transactions',this)">↔️ Transactions</button><button onclick="showView('suppliers',this)">🏢 Suppliers</button><button onclick="showView('alerts',this)">⚠️ Low Stock</button><button onclick="showView('settings',this)">⚙️ Settings</button></aside><main>
<section id="dashboard" class="view active"><div class="title"><div><h2>Dashboard</h2><div class="muted">Inventory overview and business metrics</div></div><button class="primary" onclick="openItem()">+ Add Item</button></div><div class="cards"><div class="card"><div class="label">Products</div><div class="num" id="dProducts">0</div></div><div class="card"><div class="label">Units in Stock</div><div class="num" id="dUnits">0</div></div><div class="card"><div class="label">Inventory Cost</div><div class="num" id="dCost">$0</div></div><div class="card"><div class="label">Retail Value</div><div class="num" id="dRetail">$0</div></div><div class="card"><div class="label">Potential Profit</div><div class="num" id="dProfit">$0</div></div></div><div class="two"><div class="panel"><h3>Stock alerts</h3><div id="dashAlerts"></div></div><div class="panel"><h3>Recent transactions</h3><div id="dashTx"></div></div></div></section>
<section id="items" class="view"><div class="title"><div><h2>Inventory</h2><div class="muted">Products, pricing, photos, suppliers and stock levels</div></div><button class="primary" onclick="openItem()">+ Add Item</button></div><div class="panel"><div class="actions"><input id="itemSearch" placeholder="Search item, barcode, SKU, supplier..." oninput="renderItems()" style="flex:1;min-width:220px"><button class="ghost" onclick="exportCSV()">Export CSV</button></div></div><div class="panel tablewrap"><table><thead><tr><th>Photo</th><th>Item</th><th>Barcode/SKU</th><th>Supplier</th><th>Cost</th><th>Sell</th><th>Qty</th><th>Reorder</th><th>Actions</th></tr></thead><tbody id="itemRows"></tbody></table></div></section>
<section id="transactions" class="view"><div class="title"><div><h2>Inventory In / Out</h2><div class="muted">Every adjustment is recorded in transaction history.</div></div><button class="primary" onclick="openTx()">+ New Transaction</button></div><div class="panel tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Item</th><th>Barcode</th><th>Qty</th><th>Reason</th><th>User</th></tr></thead><tbody id="txRows"></tbody></table></div></section>
<section id="suppliers" class="view"><div class="title"><div><h2>Suppliers</h2><div class="muted">Manage supplier contact information.</div></div><button class="primary" onclick="openSupplier()">+ Add Supplier</button></div><div class="panel tablewrap"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Email</th><th>Items</th><th>Actions</th></tr></thead><tbody id="supplierRows"></tbody></table></div></section>
<section id="alerts" class="view"><div class="title"><div><h2>Low Stock Alerts</h2><div class="muted">Items at or below their reorder point.</div></div></div><div class="panel tablewrap"><table><thead><tr><th>Item</th><th>Barcode</th><th>Supplier</th><th>Current</th><th>Reorder Point</th><th>Suggested Order</th></tr></thead><tbody id="alertRows"></tbody></table></div></section>
<section id="settings" class="view"><div class="title"><div><h2>Settings</h2><div class="muted">Local demo security and data tools.</div></div></div><div class="panel"><h3>Change login password</h3><div class="grid"><div class="field"><label>Current password</label><input id="oldPass" type="password"></div><div class="field"><label>New password</label><input id="newPass" type="password"></div></div><div class="actions"><button class="primary" onclick="changePassword()">Change Password</button></div><p id="passMsg" class="muted"></p></div><div class="panel"><h3>Data backup</h3><p class="muted">Export a JSON backup to move inventory to another browser/device. Data is stored locally in this browser.</p><button class="ghost" onclick="backup()">Download Backup</button> <button class="ghost" onclick="$('restoreFile').click()">Restore Backup</button><input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></section>
</main></div></div><div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div>
<script>
const $=id=>document.getElementById(id);let db=JSON.parse(localStorage.getItem('stockpilotV2')||'null')||{items:[],tx:[],suppliers:[],password:'admin123'};let currentUser=null,editId=null,editSupplierId=null,scannerStream=null;function save(){localStorage.setItem('stockpilotV2',JSON.stringify(db));renderAll()}function login(){if($('loginUser').value.trim()&&$('loginPass').value===db.password){currentUser=$('loginUser').value.trim();$('login').style.display='none';$('app').style.display='block';$('userLabel').textContent=currentUser;renderAll()}else $('loginErr').textContent='Invalid username or password.'}function logout(){currentUser=null;$('app').style.display='none';$('login').style.display='grid';$('loginPass').value=''}function showView(id,btn){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');renderAll()}function money(x){return '$'+Number(x||0).toFixed(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function supplierName(id){return db.suppliers.find(s=>s.id===id)?.name||'—'}function low(x){return Number(x.qty)<=Number(x.reorder)}
function renderAll(){renderDashboard();renderItems();renderTx();renderSuppliers();renderAlerts()}function renderDashboard(){let units=db.items.reduce((a,x)=>a+Number(x.qty),0),cost=db.items.reduce((a,x)=>a+x.qty*x.cost,0),retail=db.items.reduce((a,x)=>a+x.qty*x.price,0);$('dProducts').textContent=db.items.length;$('dUnits').textContent=units;$('dCost').textContent=money(cost);$('dRetail').textContent=money(retail);$('dProfit').textContent=money(retail-cost);let alerts=db.items.filter(low);$('dashAlerts').innerHTML=alerts.length?alerts.slice(0,6).map(x=>`<div class="notice">⚠️ <b>${esc(x.name)}</b> — ${x.qty} left (reorder at ${x.reorder})</div>`).join(''):'<p class="muted">No low-stock items.</p>';let tx=db.tx.slice(-6).reverse();$('dashTx').innerHTML=tx.length?tx.map(t=>`<div style="padding:9px 0;border-bottom:1px solid #eee">${t.type==='IN'?'⬆️':'⬇️'} <b>${esc(t.itemName)}</b> · ${t.qty} · ${esc(t.reason||'')}</div>`).join(''):'<p class="muted">No transactions yet.</p>'}
function renderItems(){let q=($('itemSearch')?.value||'').toLowerCase();let list=db.items.filter(x=>(x.name+' '+x.barcode+' '+x.sku+' '+supplierName(x.supplierId)).toLowerCase().includes(q));$('itemRows').innerHTML=list.map(x=>`<tr><td>${x.photo?`<img class="thumb" src="${x.photo}">`:'—'}</td><td><b>${esc(x.name)}</b><br><small>${esc(x.category||'')}</small></td><td>${esc(x.barcode||x.sku||'—')}</td><td>${esc(supplierName(x.supplierId))}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td><span class="pill ${low(x)?'warning':'good'}">${x.qty}</span></td><td>${x.reorder}</td><td><button class="ghost" onclick="openItem('${x.id}')">Edit</button> <button class="danger" onclick="delItem('${x.id}')">Delete</button></td></tr>`).join('')}
function openItem(id=null){editId=id||null;let x=id?db.items.find(a=>a.id===id):{name:'',barcode:'',sku:'',cost:0,price:0,qty:0,reorder:5,category:'',location:'',supplierId:'',photo:''};$('modalContent').innerHTML=`<h2>${id?'Edit':'Add'} Inventory Item</h2><div class="grid"><div class="field"><label>Item name *</label><input id="fName" value="${esc(x.name)}"></div><div class="field"><label>Barcode</label><div style="display:flex;gap:6px"><input id="fBarcode" value="${esc(x.barcode)}" style="flex:1"><button class="ghost" onclick="startScanner('fBarcode')">📷 Scan</button></div></div><div class="field"><label>SKU</label><input id="fSku" value="${esc(x.sku)}"></div><div class="field"><label>Supplier</label><select id="fSupplier"><option value="">— None —</option>${db.suppliers.map(s=>`<option value="${s.id}" ${s.id===x.supplierId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Purchase cost ($)</label><input id="fCost" type="number" step=".01" min="0" value="${x.cost}"></div><div class="field"><label>Selling price ($)</label><input id="fPrice" type="number" step=".01" min="0" value="${x.price}"></div><div class="field"><label>Quantity</label><input id="fQty" type="number" min="0" value="${x.qty}"></div><div class="field"><label>Low-stock / reorder point</label><input id="fReorder" type="number" min="0" value="${x.reorder}"></div><div class="field"><label>Category</label><input id="fCategory" value="${esc(x.category)}"></div><div class="field"><label>Location</label><input id="fLocation" value="${esc(x.location)}"></div><div class="field wide"><label>Photo</label><input id="fPhoto" type="file" accept="image/*" onchange="readPhoto(event)">${x.photo?`<img id="photoPrev" class="thumb" src="${x.photo}">`:'<div id="photoPrev"></div>'}</div></div><div class="actions"><button class="primary" onclick="saveItem()">Save Item</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`;$('modal').style.display='grid';window.pendingPhoto=x.photo||''}
function readPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window.pendingPhoto=r.result;$('photoPrev').innerHTML=`<img class="thumb" src="${r.result}">`};r.readAsDataURL(f)}function saveItem(){let name=$('fName').value.trim();if(!name)return alert('Item name is required.');let data={name,barcode:$('fBarcode').value.trim(),sku:$('fSku').value.trim(),supplierId:$('fSupplier').value,cost:+$('fCost').value||0,price:+$('fPrice').value||0,qty:Math.max(0,+$('fQty').value||0),reorder:Math.max(0,+$('fReorder').value||0),category:$('fCategory').value.trim(),location:$('fLocation').value.trim(),photo:window.pendingPhoto||''};if(editId){let i=db.items.findIndex(x=>x.id===editId);db.items[i]={...db.items[i],...data}}else db.items.push({id:crypto.randomUUID(),...data});closeModal();save()}function delItem(id){if(confirm('Delete this item?')){db.items=db.items.filter(x=>x.id!==id);save()}}
function openTx(){$('modalContent').innerHTML=`<h2>New Inventory Transaction</h2><div class="grid"><div class="field"><label>Type</label><select id="tType"><option value="IN">IN — Receive stock</option><option value="OUT">OUT — Issue/sell stock</option></select></div><div class="field"><label>Item</label><select id="tItem">${db.items.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.barcode||x.sku||'no barcode')} (qty ${x.qty})</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="tQty" type="number" min="1" value="1"></div><div class="field"><label>Reason</label><input id="tReason" placeholder="Received, sold, damaged..."></div></div><div class="actions"><button class="primary" onclick="saveTx()">Post Transaction</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`;$('modal').style.display='grid'}function saveTx(){let item=db.items.find(x=>x.id===$('tItem').value),type=$('tType').value,q=Math.max(1,+$('tQty').value||1);if(!item)return alert('Add an item first.');if(type==='OUT'&&q>item.qty)return alert('Not enough stock.');item.qty+=type==='IN'?q:-q;db.tx.push({id:crypto.randomUUID(),date:new Date().toISOString(),type,itemName:item.name,barcode:item.barcode||item.sku,qty:q,reason:$('tReason').value.trim(),user:currentUser});closeModal();save()}function renderTx(){$('txRows').innerHTML=db.tx.slice().reverse().map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td><span class="pill ${t.type==='IN'?'good':'bad'}">${t.type}</span></td><td>${esc(t.itemName)}</td><td>${esc(t.barcode||'—')}</td><td>${t.qty}</td><td>${esc(t.reason||'—')}</td><td>${esc(t.user||'—')}</td></tr>`).join('')}
function openSupplier(id=null){editSupplierId=id;let s=id?db.suppliers.find(a=>a.id===id):{name:'',contact:'',phone:'',email:''};$('modalContent').innerHTML=`<h2>${id?'Edit':'Add'} Supplier</h2><div class="grid"><div class="field"><label>Supplier name *</label><input id="sName" value="${esc(s.name)}"></div><div class="field"><label>Contact person</label><input id="sContact" value="${esc(s.contact)}"></div><div class="field"><label>Phone</label><input id="sPhone" value="${esc(s.phone)}"></div><div class="field"><label>Email</label><input id="sEmail" value="${esc(s.email)}"></div></div><div class="actions"><button class="primary" onclick="saveSupplier()">Save Supplier</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`;$('modal').style.display='grid'}function saveSupplier(){let name=$('sName').value.trim();if(!name)return alert('Supplier name is required.');let d={name,contact:$('sContact').value.trim(),phone:$('sPhone').value.trim(),email:$('sEmail').value.trim()};if(editSupplierId){let i=db.suppliers.findIndex(x=>x.id===editSupplierId);db.suppliers[i]={...db.suppliers[i],...d}}else db.suppliers.push({id:crypto.randomUUID(),...d});closeModal();save()}function renderSuppliers(){$('supplierRows').innerHTML=db.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact||'—')}</td><td>${esc(s.phone||'—')}</td><td>${esc(s.email||'—')}</td><td>${db.items.filter(x=>x.supplierId===s.id).length}</td><td><button class="ghost" onclick="openSupplier('${s.id}')">Edit</button> <button class="danger" onclick="delSupplier('${s.id}')">Delete</button></td></tr>`).join('')}function delSupplier(id){if(confirm('Delete supplier? Items will remain but become unsupplied.')){db.suppliers=db.suppliers.filter(x=>x.id!==id);db.items.forEach(x=>{if(x.supplierId===id)x.supplierId=''});save()}}function renderAlerts(){$('alertRows').innerHTML=db.items.filter(low).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.barcode||x.sku||'—')}</td><td>${esc(supplierName(x.supplierId))}</td><td><span class="pill warning">${x.qty}</span></td><td>${x.reorder}</td><td>${Math.max(0,x.reorder*2-x.qty)}</td></tr>`).join('')}
function closeModal(){stopScanner();$('modal').style.display='none';$('modalContent').innerHTML=''}async function startScanner(target){if(!('BarcodeDetector' in window)){alert('Camera barcode scanning is not supported by this browser. Try current Chrome/Edge on HTTPS/localhost, or type the barcode manually.');return} $('modalContent').insertAdjacentHTML('beforeend','<div class="scanner" id="scanner"><h3>Scan barcode</h3><video id="video" autoplay playsinline></video><p class="muted">Point the camera at the barcode.</p><button class="ghost" onclick="stopScanner()">Stop camera</button></div>');$('scanner').style.display='block';try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=scannerStream;let detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','qr_code']});const scan=async()=>{if(!scannerStream)return;try{let codes=await detector.detect($('video'));if(codes.length){$(target).value=codes[0].rawValue;stopScanner();return}}catch(e){}requestAnimationFrame(scan)};scan()}catch(e){alert('Camera permission was not available. You can type the barcode manually.')}}function stopScanner(){if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}let s=$('scanner');if(s)s.style.display='none'}function changePassword(){if($('oldPass').value!==db.password)return $('passMsg').textContent='Current password is incorrect.';let p=$('newPass').value;if(p.length<6)return $('passMsg').textContent='Use at least 6 characters.';db.password=p;save();$('oldPass').value='';$('newPass').value='';$('passMsg').textContent='Password changed successfully.'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='stockpilot-backup.json';a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.tx||!x.suppliers)throw 0;db=x;save();alert('Backup restored.')}catch(_){alert('Invalid backup file.')}};r.readAsText(f)}function exportCSV(){let rows=[['Item','Barcode','SKU','Supplier','Purchase Cost','Selling Price','Quantity','Reorder Point','Category','Location'],...db.items.map(x=>[x.name,x.barcode,x.sku,supplierName(x.supplierId),x.cost,x.price,x.qty,x.reorder,x.category,x.location])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stockpilot-inventory.csv';a.click()}renderAll();
</script></body></html>
